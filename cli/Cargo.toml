[package]
name = "jycut"
version = "0.1.0"
edition = "2021"
description = "Local CLI that builds verifiable, fully editable JianYing/CapCut drafts from a JSON plan — no account, no upload, deterministic."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
