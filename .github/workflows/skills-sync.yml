---
name: skills-sync

"on":
  repository_dispatch:
    types: [skills-updated]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SKILLS_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          token: ${{ secrets.SKILLS_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Vendor skills from pinned sources
        run: python3 scripts/vendor/skill_vendor.py update
      - name: Verify the fresh snapshot
        run: python3 scripts/vendor/skill_vendor.py check
      - name: Push the sync branch when the snapshot changed
        id: push
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "vendored skills already current; nothing to sync"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          bot="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.email "$bot"
          git checkout -B chore/skills-sync
          git add skills/ skills.lock.json
          git commit -m "chore: sync vendored skills from source packages"
          git push --force-with-lease origin chore/skills-sync
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open the sync PR if none exists
        if: steps.push.outputs.changed == 'true'
        run: |
          if gh pr view chore/skills-sync >/dev/null 2>&1; then
            echo "sync PR already open; branch updated"
            exit 0
          fi
          body="Automated refresh of the vendored skill snapshot from"
          gh pr create \
            --title "chore: sync vendored skills" \
            --body "$body skills.lock.json sources; gates green to merge" \
            --head chore/skills-sync --base main \
            --label skills-sync
