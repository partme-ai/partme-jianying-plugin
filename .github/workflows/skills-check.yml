---
name: skills-check

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  vendor-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Verify vendored skills match the lockfile digests
        run: python3 scripts/vendor/skill_vendor.py check --offline
      - name: Verify lockfile pins still match upstream
        run: python3 scripts/vendor/skill_vendor.py check
      - name: Reject direct skill edits that bypass the source package
        if: github.event_name == 'pull_request'
        run: |
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base...HEAD")"
          sk="$(echo "$changed" | grep '^skills/' || true)"
          lk="$(echo "$changed" | grep '^skills[.]lock[.]json$' || true)"
          if [ -n "$sk" ] && [ -z "$lk" ]; then
            echo "::error::skills/ changed without skills.lock.json."
            echo "Skill bodies are vendored; edit the source package"
            echo "and run scripts/vendor/skill_vendor.py update."
            exit 1
          fi
